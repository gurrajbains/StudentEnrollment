
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/theme.css">
</head>

<body>

    <!-- All users start from this shared login screen. -->
    <header>
        <h1>Student Enrollment System</h1>
    </header>

    <main>
        <div class="login-container">
            <h2>Login</h2>
            <p>Enter your username and password.</p>

            <!-- Collect credentials for Flask to authenticate. -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">Login</button>
            </form>
            <p id="login-error" role="alert" hidden></p>
        </div>
    </main>

    <script>
        // Send credentials to Flask and redirect based on the returned role.
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const error = document.getElementById("login-error");
            error.hidden = true;
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            try {
                const response = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password})});
                if (!response.ok) throw new Error("Login failed. Check your username and password.");
                const result = await response.json();

                // Each successful login opens the corresponding protected dashboard.
                const pages = {student: "/student.html", teacher: "/teacher.html", admin: "/admin.html"};
                if (!pages[result.user?.role]) throw new Error("Unknown account role.");
                window.location.href = pages[result.user.role];
            } catch (err) {
                error.textContent = err.message;
                error.hidden = false;
            }
        });
    </script>
</body>
</html>
